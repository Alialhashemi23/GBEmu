name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ROM build tools
        run: sudo apt-get update && sudo apt-get install -y bison libpng-dev

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-v4 # bump to refetch/rebuild the third-party test suites

      - name: Fetch test data
        run: ./scripts/fetch-test-data.sh

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"
